<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Imitation Assignment</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Georgia, serif;
      background: #1f2430;
      color: #f2f2f2;
    }
    h1 { text-align: center; margin: 0 0 24px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      padding: 16px;
      background: #2b3242;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    figcaption { margin-top: 12px; font-size: 0.95rem; opacity: 0.85; text-align: center; }
    svg { display: block; max-width: 100%; height: auto; }

    /* ===== 1. Butterfly ===== */
    .butterfly {
      width: 400px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
    }

    /* ===== 2. Dinosaur  ===== */
    .dino-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
    }
    .dino {
      width: 260px;
      filter: drop-shadow(6px 8px 6px rgba(0, 0, 0, 0.25));
    }

    /* ===== 3. Football field  ===== */
    .field-wrap {
      position: relative;
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .field { width: 100%; filter: brightness(1.1) saturate(1.2); }
    .ttt {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 94%;
      width: auto;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      mix-blend-mode: multiply;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    /* ===== 4. Penguins  ===== */
    .penguins {
      width: 450px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    /* ===== 5. Seagull  ===== */
    .white-bg {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      width: 100%;
      max-width: 480px;
    }
    .seagull {
      width: 100%;
      filter: drop-shadow(0 12px 8px rgba(0, 0, 0, 0.22));
    }

    /* ===== 6. Theater stage  ===== */
    .stage-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      overflow: hidden;
    }
    .stage { width: 100%; }
    .stage-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, transparent 55%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
    }
  </style>
</head>

        <circle cx="171" cy="21" r="2.4" fill="#111"/><circle cx="237" cy="19" r="2.4" fill="#111"/>

          <path d="M296 244 C352 230 436 234 506 292 L498 301 C440 293 362 292 298 270 Z" fill="url(#wingRg)"/>

          <path d="M458 268 L506 292 L498 301 L450 288 Z" fill="#151515"/>

          <circle cx="316" cy="244" r="21" fill="#fcfcfc"/>

      <figcaption>5. Seagull </figcaption>

    <!-- 6. THEATER STAGE -->
    <figure>
      <div class="stage-wrap">
        <svg class="stage" viewBox="0 0 400 352" role="img" aria-label="Theater stage with red curtains, spotlights and red seats">
          <defs>
            <linearGradient id="foldsBack" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="20" y2="0" spreadMethod="repeat">
              <stop offset="0" stop-color="#8f0d12"/><stop offset=".4" stop-color="#d3282b"/><stop offset=".65" stop-color="#b3151a"/><stop offset="1" stop-color="#7d0a0f"/>
            </linearGradient>
            <linearGradient id="foldsSide" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="0" spreadMethod="repeat">
              <stop offset="0" stop-color="#9a0c11"/><stop offset=".35" stop-color="#e03235"/><stop offset=".6" stop-color="#b9161b"/><stop offset="1" stop-color="#7a090d"/>
            </linearGradient>
            <linearGradient id="shadeL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="95" y2="0">
              <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
            </linearGradient>
            <linearGradient id="shadeR" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="305" y2="0">
              <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
            </linearGradient>
            <radialGradient id="wallLight" cx="50%" cy="0%" r="90%">
              <stop offset="0" stop-color="#ff8a8a" stop-opacity=".55"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
            </radialGradient>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/>
            </linearGradient>
            <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8a6240"/><stop offset="1" stop-color="#3d2616"/>
            </linearGradient>
            <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="seatTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e02a2e"/><stop offset="1" stop-color="#a50f15"/>
            </linearGradient>
            <filter id="softBeam"><feGaussianBlur stdDeviation="2.5"/></filter>
          </defs>

          <!-- back wall curtain -->
          <rect width="400" height="214" fill="url(#foldsBack)"/>
          <rect width="400" height="214" fill="url(#wallLight)"/>

          <!-- spotlight beams -->
          <g filter="url(#softBeam)">
            <polygon points="150,0 190,0 232,212 50,212" fill="url(#beam)" opacity=".5"/>
            <polygon points="210,0 250,0 350,212 168,212" fill="url(#beam)" opacity=".5"/>
            <polygon points="164,0 236,0 296,212 104,212" fill="url(#beam)" opacity=".5"/>
          </g>

          <!-- wooden floor in perspective -->
          <polygon points="0,205 400,205 400,258 0,258" fill="url(#floor)"/>
          <g stroke="#2b1a10" stroke-width="1.3" opacity=".75">
            <line x1="-20" x2="-120" y1="205" y2="258"/><line x1="30" x2="-30" y1="205" y2="258"/>
            <line x1="80" x2="40" y1="205" y2="258"/><line x1="130" x2="110" y1="205" y2="258"/>
            <line x1="180" x2="170" y1="205" y2="258"/><line x1="230" x2="240" y1="205" y2="258"/>
            <line x1="280" x2="310" y1="205" y2="258"/><line x1="330" x2="370" y1="205" y2="258"/>
            <line x1="380" x2="440" y1="205" y2="258"/><line x1="430" x2="520" y1="205" y2="258"/>
          </g>
          <ellipse cx="200" cy="232" rx="125" ry="22" fill="url(#floorGlow)"/>
          <rect y="254" width="400" height="9" fill="#2a0e0e"/>

          <!-- side curtains -->
          <path d="M0 0 H92 C72 60 98 150 76 246 H0 Z" fill="url(#foldsSide)"/>
          <path d="M0 0 H92 C72 60 98 150 76 246 H0 Z" fill="url(#shadeL)"/>
          <path d="M400 0 H308 C328 60 302 150 324 246 H400 Z" fill="url(#foldsSide)"/>
          <path d="M400 0 H308 C328 60 302 150 324 246 H400 Z" fill="url(#shadeR)"/>

          <!-- audience seats -->
          <rect y="263" width="400" height="89" fill="#4d070b"/>
          <g fill="url(#seatTop)">
            <rect x="2" y="268" width="62" height="30" rx="7"/><rect x="68" y="268" width="62" height="30" rx="7"/>
            <rect x="134" y="268" width="62" height="30" rx="7"/><rect x="200" y="268" width="62" height="30" rx="7"/>
            <rect x="266" y="268" width="62" height="30" rx="7"/><rect x="332" y="268" width="66" height="30" rx="7"/>
          </g>
          <g fill="url(#seatTop)">
            <rect x="2" y="304" width="62" height="48" rx="7"/><rect x="68" y="304" width="62" height="48" rx="7"/>
            <rect x="134" y="304" width="62" height="48" rx="7"/><rect x="200" y="304" width="62" height="48" rx="7"/>
            <rect x="266" y="304" width="62" height="48" rx="7"/><rect x="332" y="304" width="66" height="48" rx="7"/>
          </g>
        </svg>
      </div>
      <figcaption>6. Theater stage </figcaption>
    </figure>

  </div>
