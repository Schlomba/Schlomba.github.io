<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Scheme Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 30px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background-color: white;
        }

        table, th, td {
            border: 2px solid black;
        }

        th, td {
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
        }

        .deepblue {
            background-color: #003366;
            color: white;
        }

        .orange {
            background-color: #FF8C42;
        }

        .gold {
            background-color: #FFD700;
        }

        .teal {
            background-color: #20B2AA;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th colspan="4">Ocean Sunset</th>
        </tr>

        <tr>
            <td class="deepblue"><strong>Deep Blue</strong></td>
            <td class="orange"><strong>Sunset Orange</strong></td>
            <td class="gold"><strong>Golden Sun</strong></td>
            <td class="teal"><strong>Ocean Teal</strong></td>
        </tr>

        <tr>
            <td>#003366</td>
            <td>#FF8C42</td>
            <td>#FFD700</td>
            <td>#20B2AA</td>
        </tr>

        <tr>
            <td>rgb(0, 51, 102)</td>
            <td>rgb(255, 140, 66)</td>
            <td>rgb(255, 215, 0)</td>
            <td>rgb(32, 178, 170)</td>
        </tr>

        <tr>
            <td>hsl(210, 100%, 20%)</td>
            <td>hsl(24, 100%, 63%)</td>
            <td>hsl(51, 100%, 50%)</td>
            <td>hsl(177, 70%, 41%)</td>
        </tr>

    </table>

</body>
</html>
